<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e7dcf5" />

    <!-- Customize the browser-tab title here -->
    <title>Our Memories</title>
    <meta name="description" content="A little place for our memories." />

    <!-- No-flash theme: apply the saved light/dark choice before first paint. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("photo-gallery/theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          }
          var dark = t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", dark ? "#140f1f" : "#e7dcf5");
        } catch (e) {}
      })();
    </script>

    <!-- Icons + installable web app -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237c53b8'/><circle cx='16' cy='16' r='5.5' fill='%23f6effe'/></svg>"
    />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Memories" />

    <!-- Social sharing (Open Graph + Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Our Memories" />
    <meta property="og:description" content="A little place for our memories." />
    <meta property="og:image" content="/images/mem-hero.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Our Memories" />
    <meta name="twitter:description" content="A little place for our memories." />
    <meta name="twitter:image" content="/images/mem-hero.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
